name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  nightly-preflight:
    name: Nightly preflight
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip-nightly: ${{ steps.select.outputs.skip-nightly }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          actions="repos/$GITHUB_REPOSITORY/actions"
          if current=$(timeout 20s gh api "$actions/runs/$GITHUB_RUN_ID" --jq '[.workflow_id, .created_at] | @tsv') &&
             read -r workflow started <<< "$current" &&
             [[ $workflow =~ ^[1-9][0-9]*$ && -n $started ]] &&
             history=$(timeout 20s gh api --method GET "$actions/workflows/$workflow/runs" \
               -f branch=main -f event=schedule -f status=completed -f created="<$started" -F per_page=30) &&
             previous=$(jq -er --argjson id "$GITHUB_RUN_ID" --argjson number "$GITHUB_RUN_NUMBER" \
               --argjson workflow "$workflow" --arg started "$started" '
               ($started | fromdateiso8601) as $start
               | [.workflow_runs[] | select(
                   (.id | numbers) != $id and (.run_number | numbers) < $number
                   and .workflow_id == $workflow and .head_branch == "main"
                   and .event == "schedule" and .status == "completed"
                   and (.conclusion == "success" or .conclusion == "failure")
                   and (.updated_at | fromdateiso8601) < $start
                 )] | max_by(.run_number).head_sha // empty' <<< "$history") &&
             [[ $previous =~ ^[0-9a-f]{40}$ && $previous == "$GITHUB_SHA" ]]; then
            echo 'skip-nightly=true' >> "$GITHUB_OUTPUT"
            echo 'The last completed nightly used the same commit.'
          else
            echo 'No confirmed same-commit nightly; run the full suite.'
          fi

  rust:
    name: Rust
    if: github.event_name != 'schedule'
    runs-on: macos-latest

    steps: &rust-steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -q --message-format=short --check
      - run: cargo clippy -q --message-format=short -- -D warnings
      - uses: taiki-e/install-action@nextest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: cargo nextest run --cargo-quiet --no-tests=fail
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: cargo package --locked
      - name: Check for changes outside documentation
        id: product-changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD -- . ':(exclude,glob)**/*.md' ':(exclude,top,literal)LICENSE')
          if [[ -n "$changed" ]]; then
            echo 'run-smoke=true' >> "$GITHUB_OUTPUT"
          fi
      - run: cargo build -q --message-format=short --locked
        if: steps.product-changes.outputs.run-smoke == 'true'
      - name: Switch input sources with issw
        if: steps.product-changes.outputs.run-smoke == 'true'
        shell: bash
        run: |
          original=$(target/debug/issw current)
          original_id=${original%%$'\t'*}
          target_id=com.apple.keylayout.Dvorak
          test -n "$original_id"
          test "$original_id" != "$target_id"

          swift - "$target_id" <<'SWIFT'
          import Carbon
          import Foundation

          let filter = [kTISPropertyInputSourceID as String: CommandLine.arguments[1]] as CFDictionary
          let sources = TISCreateInputSourceList(filter, true).takeRetainedValue() as NSArray as! [TISInputSource]
          precondition(sources.count == 1, "Expected exactly one installed Dvorak layout")
          precondition(TISEnableInputSource(sources[0]) == noErr, "Could not enable Dvorak")
          SWIFT

          target=$(target/debug/issw list | awk -F '\t' -v id="$target_id" '$1 == id && length($2)')
          test -n "$target"
          target/debug/issw "$target_id"
          selected=$(target/debug/issw current)
          test "$selected" = "$target"
          target/debug/issw "$original_id"
          restored=$(target/debug/issw current)
          test "$restored" = "$original"
          printf 'Switched to %s and restored %s\n' "$target_id" "$original_id"

  nightly:
    name: Nightly Rust
    needs: nightly-preflight
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.nightly-preflight.outputs.skip-nightly != 'true' }}
    runs-on: macos-latest
    steps: *rust-steps
