name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  nightly-preflight:
    name: Nightly preflight
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-suite: ${{ steps.select.outputs.run-suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly.py
      - name: Nightly SHA already covered
        if: steps.select.outputs.run-suite == 'false'
        run: echo 'The same commit has already completed a nightly suite.'

  rust:
    name: Rust
    if: github.event_name != 'schedule'
    runs-on: macos-latest

    steps: &rust-steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt -q --message-format=short --check
      - run: cargo clippy -q --message-format=short -- -D warnings
      - uses: taiki-e/install-action@nextest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: cargo nextest run --cargo-quiet --no-tests=fail
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: cargo package --locked
      - name: Check for changes outside documentation
        id: product-changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD -- . ':(exclude,glob)**/*.md' ':(exclude,top,literal)LICENSE')
          if [[ -n "$changed" ]]; then
            echo 'run-smoke=true' >> "$GITHUB_OUTPUT"
          fi
      - run: cargo build -q --message-format=short --locked
        if: steps.product-changes.outputs.run-smoke == 'true'
      - name: Switch input sources with issw
        if: steps.product-changes.outputs.run-smoke == 'true'
        shell: bash
        run: |
          original=$(target/debug/issw current)
          original_id=${original%%$'\t'*}
          target_id=com.apple.keylayout.Dvorak
          test -n "$original_id"
          test "$original_id" != "$target_id"

          swift - "$target_id" <<'SWIFT'
          import Carbon
          import Foundation

          let filter = [kTISPropertyInputSourceID as String: CommandLine.arguments[1]] as CFDictionary
          let sources = TISCreateInputSourceList(filter, true).takeRetainedValue() as NSArray as! [TISInputSource]
          precondition(sources.count == 1, "Expected exactly one installed Dvorak layout")
          precondition(TISEnableInputSource(sources[0]) == noErr, "Could not enable Dvorak")
          SWIFT

          target=$(target/debug/issw list | awk -F '\t' -v id="$target_id" '$1 == id && length($2)')
          test -n "$target"
          target/debug/issw "$target_id"
          selected=$(target/debug/issw current)
          test "$selected" = "$target"
          target/debug/issw "$original_id"
          restored=$(target/debug/issw current)
          test "$restored" = "$original"
          printf 'Switched to %s and restored %s\n' "$target_id" "$original_id"

  nightly:
    name: Nightly Rust
    needs: nightly-preflight
    if: needs.nightly-preflight.outputs.run-suite == 'true'
    runs-on: macos-latest
    steps: *rust-steps
